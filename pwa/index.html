<!doctype html>
<html lang="en">
  <head>
    <title>Olivine</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../lib/pico.min.css" />
    <link rel="stylesheet" href="../fonts/victormono.css" />
    <link rel="stylesheet" href="../lib/metap/metap.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/panes.css" />
    <link rel="stylesheet" href="../styles/editor.css" />
    <link rel="stylesheet" href="../styles/codemirror.css" />
    <link rel="stylesheet" href="../fonts/iconoir/iconoir.css" />
    <link rel="stylesheet" href="../fonts/monoid.css" />
    <link
      href="../lib/vanilla-calendar/vanilla-calendar.css"
      rel="stylesheet"
    />
    <link rel="icon" href="../media/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="manifest.json" />
    <!--INJECT_OLIVINE_MODE-->
    <script type="importmap">
      {
        "imports": {
          "CodeMirrorBundle": "../lib/codemirror-bundle.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app-container">
      <div id="content-wrapper">
        <aside id="left-sidebar">
          <header id="sidebar-header">
            <button id="open-vault-btn">Open Vault</button>
          </header>
          <nav>
            <ul id="notes-list"></ul>
          </nav>
          <div class="gutter gutter-row" id="left-sidebar-gutter"></div>
          <div id="sidebar-panel-container"></div>
        </aside>
        <div class="gutter gutter-col" id="main-gutter"></div>
        <main id="main-content">
          <div id="panes-container"></div>
        </main>
        <div class="gutter gutter-col" id="right-gutter"></div>
        <aside id="right-sidebar" class="sidebar">
          <div
            id="right-sidebar-panel-container"
            class="sidebar-panel-container"
          ></div>
        </aside>
      </div>

      <footer id="statusbar-container"></footer>
    </div>
    <script src="../lib/vanilla-calendar/vanilla-calendar.js"></script>
    <script src="../lib/split-grid.js"></script>
    <script src="../lib/metap/metap.js"></script>
    <script src="pwa-bridge.js"></script>
    <script type="module" src="../app/main.js"></script>
  </body>
</html>
